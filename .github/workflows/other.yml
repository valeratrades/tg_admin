jobs:
  load_nix:
    runs-on: ubuntu-latest
    steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - name: Cache packages
      run: '# Pre-fetch packages into nix store so they''re cached for dependent jobs

        # Use nix-shell which properly sets up env vars like PKG_CONFIG_PATH

        nix-shell -p mold pkg-config openssl.out openssl.dev --run "echo packages
        cached"

        '
  loc-badge:
    name: Update LOC Badge
    needs: load_nix
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - env:
        loc_gist_token: ${{ secrets.loc_gist_token }}
      name: Ensure loc_gist_token secret is configured
      run: "nix-shell -p mold pkg-config openssl.out openssl.dev --command \"export\
        \ LD_LIBRARY_PATH=\\\"\\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\\\
        ${LD_LIBRARY_PATH:+:}\\$LD_LIBRARY_PATH\\\" && export LD_LIBRARY_PATH=\\\"\
        \\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\\${LD_LIBRARY_PATH:+:}\\\
        $LD_LIBRARY_PATH\\\" && export LD_LIBRARY_PATH=\\\"\\$(nix-build '<nixpkgs>'\
        \ -A openssl.out --no-out-link)/lib\\${LD_LIBRARY_PATH:+:}\\$LD_LIBRARY_PATH\\\
        \" && export LD_LIBRARY_PATH=\\\"\\$(nix-build '<nixpkgs>' -A openssl.dev\
        \ --no-out-link)/lib\\${LD_LIBRARY_PATH:+:}\\$LD_LIBRARY_PATH\\\" && if [\
        \ -z \\\"\\${loc_gist_token}\\\" ]; then\n  echo \\\"::error::Secret 'loc_gist_token'\
        \ is not set (empty in this job).\\\"\n  if [ \\\"${{ github.event.repository.private\
        \ }}\\\" = \\\"true\\\" ]; then\n    echo \\\"::error::This repo is PRIVATE.\
        \ On GitHub Free-plan orgs, organization secrets are NOT exposed to private\
        \ repos — if 'loc_gist_token' is set org-wide it still won't reach here. Fix:\
        \ set it repo-level (gh secret set loc_gist_token -R ${{ github.repository\
        \ }}), or upgrade the org to Team/Enterprise.\\\"\n  else\n    echo \\\"::error::Add\
        \ it under Settings → Secrets and variables → Actions (repo-level, or org-level\
        \ with 'All repositories' visibility — org secrets reach public repos on any\
        \ plan).\\\"\n  fi\n  echo \\\"::error::Create a token, then: gh secret set\
        \ loc_gist_token --repo <owner>/<repo> --body YOUR_TOKEN\\\"\n  echo \\\"\
        ::error::Bulk-provision all repos: https://github.com/valeratrades/nix/tree/e4338bf5943d7403b949a8e079f9073987d9cd68/home/scripts/shared_github_secrets.bash\\\
        \"\n  exit 1\nfi\n\""
    - name: Install tokei
      run: nix-shell -p mold pkg-config openssl.out openssl.dev --command "export
        LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && cargo install tokei"
    - id: count
      name: Count lines of code
      run: 'nix-shell -p mold pkg-config openssl.out openssl.dev --command "export
        LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build ''<nixpkgs>'' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && # Extract repository name (e.g., \"valeratrades/readme-fw\" -> \"readme-fw\")

        PNAME=\"\${GITHUB_REPOSITORY##*/}\"

        echo \"pname=\$PNAME\" >> \$GITHUB_OUTPUT


        LOC=\$(tokei --output json | jq ''.Total.code'')

        echo \"loc=\$LOC\" >> \$GITHUB_OUTPUT

        echo \"Lines of code for \$PNAME: \$LOC\"


        # Generate JSON with project-specific filename

        echo \"{\\"schemaVersion\\": 1, \\"label\\": \\"LoC\\", \\"message\\": \\"\$LOC\\",
        \\"color\\": \\"lightblue\\"}\" > \${PNAME}-loc.json

        "'
    - name: Display generated JSON
      run: nix-shell -p mold pkg-config openssl.out openssl.dev --command "export
        LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A mold --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A pkg-config --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.out --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && export LD_LIBRARY_PATH=\"\$(nix-build '<nixpkgs>' -A openssl.dev --no-out-link)/lib\${LD_LIBRARY_PATH:+:}\$LD_LIBRARY_PATH\"
        && cat ${{ steps.count.outputs.pname }}-loc.json"
    - name: Update gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        file_path: ${{ steps.count.outputs.pname }}-loc.json
        gist_id: b48e6f02c61942200e7d1e3eeabf9bcb
        token: ${{ secrets.loc_gist_token }}
name: Other
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
